# The split deployment: nginx serves the app and proxies the API and the socket
# to the game servers, so the browser still sees a single origin.
upstream friendzone_api {
  server server:8080;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # WebSocket. No buffering and a long read timeout, because this connection is
  # idle between rounds and must outlive the server's 15-second heartbeat.
  location /ws/ {
    proxy_pass http://friendzone_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # The API. X-Forwarded-For matters here: it is the subject of the room
  # creation and join rate limits.
  location /api/ {
    proxy_pass http://friendzone_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health { proxy_pass http://friendzone_api; }
  location = /ready  { proxy_pass http://friendzone_api; }

  # Hashed filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Generated game images: named by subject id, replaced only by a rebuild.
  location /content/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # The shell must never be cached, or a deploy leaves people on the old bundle.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Anything that is not a file is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
