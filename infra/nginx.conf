server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Generated game images: content-addressed by id, replaced only by a rebuild.
  location /content/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # The shell must never be cached, or a deploy leaves people on the old bundle.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Anything that is not a file is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
