# The whole product on one box.
#
#   export SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
#   export POSTGRES_PASSWORD=$(openssl rand -base64 24)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Then open http://localhost:8080 — or put a TLS proxy in front and share that.
#
# `app` serves the web app, the API and the WebSocket on one origin, so there is
# no proxy to configure and no CORS. For a larger deployment, build the `server`
# and `web` targets instead and put the web container in front; see
# docs/deployment.md.

# An explicit project name, because Compose otherwise derives it from the
# directory — which both this file and docker-compose.yml share. Without it,
# bringing this stack up in a checkout that is also running the dev stack
# adopts those containers and recreates them with production settings,
# orphaning their volumes.
name: friendzone-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friendzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-friendzone}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-friendzone}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Append-only, no snapshots: a restart replays the log, and rooms that do
    # not survive simply expire rather than being half-restored.
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      target: allinone
      args:
        # Set this to a contact address to build with real photographs from
        # Wikimedia Commons. Left empty, the build generates placeholder art,
        # which plays identically.
        WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-}
    ports: ["${PORT:-8080}:8080"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-friendzone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-friendzone}
      REDIS_URL: redis://redis:6379
      # Same origin as the app, so this only matters if you later split them.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Room for the drain sequence to finish before the container is killed.
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-friendzone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-friendzone}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # It may be mid-derivation; let it finish.
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
